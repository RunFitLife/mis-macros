<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunFitLife Nutrición</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12191B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RunFit Nutri">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EEF1EC;
  --surface: #FFFFFF;
  --ink: #18262B;
  --muted: #5B6B70;
  --line: #D5DBD3;
  --track: #E3E8E1;
  --prot: #2F55B8;
  --carb: #C9860F;
  --fat: #CF4F66;
  --fib: #2E7D5B;
  --ok: #2E7D5B;
  --warn: #B4531A;
  --font-head: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191B; --surface: #1B2528; --ink: #E8EEEA; --muted: #9AABA9; --line: #2D3A3D; --track: #26323A;
    --prot: #7C9CF0; --carb: #F0B544; --fat: #F0869A; --fib: #5BC49A; --ok: #5BC49A; --warn: #F0A070;
  }
}
:root[data-theme="dark"] {
  --bg: #12191B; --surface: #1B2528; --ink: #E8EEEA; --muted: #9AABA9; --line: #2D3A3D; --track: #26323A;
  --prot: #7C9CF0; --carb: #F0B544; --fat: #F0869A; --fib: #5BC49A; --ok: #5BC49A; --warn: #F0A070;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.app { max-width: 640px; margin: 0 auto; padding: 16px 16px 104px; }
h1, h2 { font-family: var(--font-head); font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: 0; }
h1 { font-size: 34px; }
h2 { font-size: 24px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--prot); outline-offset: 2px; }

.brand { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-family: var(--font-head); font-weight: 600; font-size: 20px; }
.brand img { display: block; border-radius: 7px; }
.datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.datenav h1 { text-align: center; flex: 1; }
.ib { display: inline-grid; place-items: center; min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 20px; line-height: 1; }
.ib:disabled { opacity: .35; cursor: default; }

.board { padding: 8px 0 16px; }
.board .num { font-family: var(--font-head); font-weight: 700; font-size: 80px; line-height: .9; }
.board .unit { font-family: var(--font-head); font-weight: 500; font-size: 24px; margin-left: 8px; }
.board.over .num, .board.over .unit { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.card h2 { margin-bottom: 8px; }
.card-head h2 { margin-bottom: 0; }

.lane { margin-bottom: 18px; }
.lane:last-child { margin-bottom: 0; }
.lane-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.lane-name { font-family: var(--font-head); font-weight: 600; font-size: 21px; }
.lane-val { font-size: 15px; color: var(--muted); }
.lane-val b { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 16px; background: var(--track); border-radius: 8px; }
.fill { height: 100%; border-radius: 8px; min-width: 0; transition: width .4s ease; }
.finish { position: absolute; left: 80%; top: -5px; bottom: -5px; width: 8px; transform: translateX(-50%); border-radius: 2px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0 / 4px 4px; border: 1px solid var(--ink); }
.lane-note { font-size: 14px; margin-top: 6px; color: var(--muted); }
.lane.ok .lane-note { color: var(--ok); font-weight: 500; }
.lane.high .lane-note { color: var(--warn); font-weight: 500; }
.micro .lane { margin-bottom: 14px; }
.micro .lane-name { font-size: 18px; }
.micro .track { height: 8px; border-radius: 4px; }
.micro .fill { border-radius: 4px; }
.micro .finish { width: 6px; top: -3px; bottom: -3px; background-size: 3px 3px; }

.fb { list-style: none; padding: 0; margin: 8px 0 0; }
.fb li { border-left: 3px solid var(--muted); padding: 2px 0 2px 10px; margin: 10px 0; }
.fb li.high { border-color: var(--warn); }
.fb li.good { border-color: var(--ok); }

.items { list-style: none; padding: 0; margin: 0; }
.items > li { padding: 10px 0; border-top: 1px solid var(--line); }
.items > li:first-child { border-top: 0; padding-top: 0; }
.irow { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.iname { font-weight: 600; }
.imacros { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.swap { margin-top: 8px; background: var(--track); border-radius: 10px; padding: 8px 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.link { background: none; border: 0; color: var(--prot); text-decoration: underline; font-weight: 600; min-height: 44px; padding: 0 8px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }

.supp { padding: 10px 0; border-top: 1px solid var(--line); }
.supp:first-of-type { border-top: 0; }
.step { display: flex; align-items: center; gap: 8px; }
.step span { min-width: 24px; text-align: center; font-family: var(--font-head); font-size: 24px; font-weight: 700; }

label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
input, select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px 12px; font: inherit; font-size: 16px; }
.field { margin-bottom: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; min-height: 48px; padding: 10px 20px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.err { color: var(--warn); font-weight: 500; min-height: 1.5em; margin-top: 8px; }

.results { list-style: none; padding: 0; margin: 12px 0 0; }
.res { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 2px; min-height: 48px; }
.rn { display: block; font-weight: 600; }
.rm { display: block; font-size: 13px; color: var(--muted); }
details.card summary { cursor: pointer; font-family: var(--font-head); font-weight: 700; font-size: 24px; min-height: 44px; display: flex; align-items: center; }
details.card[open] summary { margin-bottom: 8px; }

.goalgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
.goal b { display: block; font-family: var(--font-head); font-size: 40px; line-height: 1; font-weight: 700; }
.goal span { font-size: 14px; color: var(--muted); }

#scanbox { margin-top: 12px; }
#scanbox[hidden] { display: none; }
#reader { width: 100%; max-width: 420px; margin: 0 auto 12px; border-radius: 12px; overflow: hidden; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px 12px; font: inherit; font-size: 14px; margin-top: 10px; resize: vertical; }
textarea[hidden] { display: none; }
.ico { display: block; flex: none; }
.chip { width: 36px; height: 36px; border-radius: 11px; display: inline-grid; place-items: center; flex: none; background: var(--track); color: var(--ink); }
.chip.prot { color: var(--prot); } .chip.carb { color: var(--carb); } .chip.fat { color: var(--fat); }
.chip.fib { color: var(--fib); } .chip.warn { color: var(--warn); }
.hi { display: flex; align-items: center; gap: 10px; }
.hi label { font: inherit; margin: 0; display: inline; }
.sup-l { display: flex; gap: 10px; align-items: center; }
.sw-t { display: flex; gap: 8px; align-items: flex-start; }
.sw-t .ico { color: var(--fib); margin-top: 2px; }
.notes { margin: 8px 0 8px; padding-left: 18px; }
.sub { font-family: var(--font-head); font-weight: 600; font-size: 20px; margin: 18px 0 6px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.filebtn:focus-within { outline: 3px solid var(--prot); outline-offset: 2px; }
details.inner { margin-top: 12px; }
details.inner summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 600; }
body.noscroll { overflow: hidden; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.mchip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); font-weight: 500; font-size: 14px; }
.mchip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.addbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 6px 0 8px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.addbar .addsum { margin: 8px 0 0; }
.searchrow { display: flex; gap: 8px; align-items: center; }
.sfield { position: relative; flex: 1; }
.sfield .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.sfield input { padding-left: 40px; min-height: 48px; }
.ib.scan { min-width: 48px; min-height: 48px; }
.rrow { display: flex; align-items: center; gap: 6px; border-top: 1px solid var(--line); }
.rrow .res { border-top: 0; flex: 1; }
.ib.add { background: var(--ink); color: var(--bg); border-color: var(--ink); }
#sheet[hidden] { display: none; }
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .45); border: 0; padding: 0; }
.dlg { position: fixed; z-index: 21; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 6vh); width: min(92vw, 560px); max-height: 88%; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.dlg-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
#toast.act { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
#toast button { background: none; border: 0; color: inherit; text-decoration: underline; font-weight: 600; min-height: 36px; padding: 0 6px; }
.wchart, .wbars { width: 100%; height: auto; display: block; margin: 10px 0 4px; }
.wchart .wg, .wbars .wg { stroke: var(--line); stroke-width: 1; }
.wchart .wtrend { fill: none; stroke: var(--prot); stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
.wchart .wp { fill: var(--muted); opacity: .7; }
.wchart text, .wbars text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.wbars .wb { fill: var(--prot); }
.wbars .wb.off { fill: var(--track); }
.wbars .wl { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
.weeklab { font-family: var(--font-head); font-weight: 600; font-size: 20px; text-align: center; flex: 1; }
.advice { background: var(--track); border-radius: 12px; padding: 12px; margin: 10px 0; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { display: flex; width: 100%; max-width: 640px; }
.nav button { flex: 1; min-height: 62px; background: none; border: 0; font-weight: 500; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 3px 0 var(--ink); }

#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<nav class="nav" aria-label="Secciones">
  <div class="nav-in" id="nav">
    <button data-v="today">Hoy</button>
    <button data-v="add">Añadir</button>
    <button data-v="progress">Progreso</button>
    <button data-v="profile">Perfil</button>
  </div>
</nav>
<div id="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

  function unitsOf(f) {

      '<p class="muted small">Guarda una copia de tu perfil, comidas, alimentos y suplementos. Te sirve si cambias de móvil o el enlace de la app.</p>' +
      '<div class="btns"><button class="btn" data-bk="down">' + ic('download', 20) + '<span>Descargar copia</span></button>' +
      '<button class="btn ghost" data-bk="copy">' + ic('copy', 20) + '<span>Copiar texto</span></button></div>' +
      '<textarea id="bktext" rows="5" readonly hidden aria-label="Texto de la copia de seguridad"></textarea>' +
      '<h3 class="sub">Restaurar una copia</h3>' +
      '<label class="btn ghost filebtn" for="impfile">' + ic('upload', 20) + '<span>Importar desde archivo</span><input class="vh" id="impfile" type="file" accept=".json,application/json"></label>' +
      '<details class="inner"><summary>Importar pegando el texto</summary><textarea id="imptext" rows="5" aria-label="Pega aquí el texto de tu copia"></textarea>' +
      '<div style="margin-top:10px"><button class="btn ghost" data-bk="pasteimp">Revisar texto</button></div></details>' +
      '<div id="impstatus" role="status" style="margin-top:12px"></div><p class="err" id="imperr" role="alert"></p></section>';
    h += '<section class="card"><h2 class="hi">' + chip('shield', 'fib') + 'Mis datos</h2><p class="muted small">Todo se guarda en este navegador. Si borras los datos del navegador, se pierden.</p>' +
      '<button class="btn ghost" data-reset="1">Borrar todos mis datos</button></section>';
    return h;
  }

  function saveProfile() {
    var p = {
      sex: $('#pf-sex').value, age: parseNum($('#pf-age').value), weight: parseNum($('#pf-weight').value),
      height: parseNum($('#pf-height').value), activity: $('#pf-act').value, goal: $('#pf-goal').value,
      bf: $('#pf-bf').value.trim() === '' ? null : parseNum($('#pf-bf').value)
    };
    var err = $('#perr');
    if (isNaN(p.age) || isNaN(p.weight) || isNaN(p.height)) { err.textContent = 'Rellena edad, peso y altura con números.'; return; }
    if (p.age < 18 || p.age > 80) { err.textContent = 'Esta app está pensada para adultos de 18 a 80 años.'; return; }
    if (p.weight < 35 || p.weight > 250) { err.textContent = 'El peso debe estar entre 35 y 250 kg.'; return; }
    if (p.height < 120 || p.height > 230) { err.textContent = 'La altura debe estar entre 120 y 230 cm.'; return; }
    if (p.bf !== null && (isNaN(p.bf) || p.bf < 5 || p.bf > 60)) { err.textContent = 'La grasa corporal debe estar entre 5 y 60 %, o déjala vacía.'; return; }
    var bmi = p.weight / Math.pow(p.height / 100, 2);
    if (p.goal === 'lose' && bmi < 20) { err.textContent = 'Con tu peso y altura (IMC ' + nf(bmi, 1) + ') no es recomendable perder peso. Elige mantener peso o ganar músculo.'; return; }
    if (S.profile && S.profile.goal !== p.goal) S.adj = null;
    S.profile = p; save(); toast('Perfil guardado'); render();
  }
  function doSwap(id) {
    var d = day(cur), idx = -1;
    d.items.forEach(function (i, n) { if (i.id === id) idx = n; });
    if (idx < 0) return;
    var old = d.items[idx], food = old.swap ? foodByName(old.swap) : null;
    if (!food) return;
    d.items[idx] = makeItem(food, old.g, old.meal);
    save(); toast('Cambiado por ' + food.n); render();
  }

  /* ---------- Render y eventos ---------- */
  function render() {
    $('#app').innerHTML = view === 'today' ? renderToday() : (view === 'add' ? renderAdd() : (view === 'progress' ? renderProgress() : renderProfile()));
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-v') === view ? 'page' : 'false');
    });
    if (view === 'add' && S.profile) { renderResults(''); updAddSummary(); }
  }
  function setView(v) { stopScan(); closePicker(); pendingImport = null; view = v; render(); window.scrollTo(0, 0); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    var ds = el.dataset;
    if (ds.bk === 'down') return downloadBackup();
    if (ds.bk === 'copy') return copyBackup();
    if (ds.bk === 'pasteimp') return reviewImport($('#imptext').value);
    if (ds.bk === 'impok') return applyImport();
    if (ds.bk === 'impno') { pendingImport = null; $('#impstatus').innerHTML = ''; return; }
    if (ds.edit) return openEdit(ds.edit);
    if (el.id === 'esave') return saveEdit();
    if (ds.edel) { var eid = ds.edel; closePicker(); return removeItem(eid); }
    if (ds.undo) return undoDelete();
    if (el.id === 'wsave') return saveWeight();
    if (ds.wdel) { S.weights = S.weights.filter(function (w) { return w.d !== ds.wdel; }); save(); return render(); }
    if (ds.week) { weekOff = Math.min(0, weekOff + Number(ds.week)); return render(); }
    if (ds.adjapply !== undefined) { S.adj = { kcal: Number(ds.adjapply), date: dateKey(new Date()) }; save(); toast('Ajuste aplicado'); return render(); }
    if (ds.adjclear) { S.adj = null; save(); toast('Ajuste quitado'); return render(); }
    if (ds.profw) { S.profile.weight = Number(ds.profw); S.adj = null; save(); toast('Peso del perfil actualizado'); return render(); }
    if (ds.meal) return setMeal(ds.meal);
    if (ds.close) return closePicker();
    if (ds.pickrecent !== undefined) {
      var rr = lastRecent[Number(ds.pickrecent)];
      if (rr) showPicker(foodByName(rr.food.n) || rr.food, { qty: rr.qty, un: rr.un });
      return;
    }
    if (ds.quick !== undefined) return quickAdd(Number(ds.quick));
    if (ds.showall !== undefined) { showAllFoods = true; return renderResults($('#q').value); }
    if (ds.more !== undefined) { resMore = true; return renderResults($('#q').value); }
    if (ds.addto) { curMeal = ds.addto; return setView('add'); }
    if (ds.favsave) return saveFav(ds.favsave);
    if (ds.favadd) return addFav(ds.favadd);
    if (ds.favdel) { S.favs = S.favs.filter(function (f) { return f.id !== ds.favdel; }); save(); return render(); }
    if (ds.v || ds.go === 'add') { if ((ds.v || ds.go) === 'add' && view !== 'add') curMeal = defaultMeal(); return setView(ds.v || ds.go); }
    if (ds.go) return setView(ds.go);
    if (ds.act === 'prev') { cur = shiftDay(cur, -1); return render(); }
    if (ds.act === 'next') { if (cur < dateKey(new Date())) { cur = shiftDay(cur, 1); render(); } return; }
    if (ds.del) return removeItem(ds.del);
    if (ds.swap) return doSwap(ds.swap);
    if (ds.sd) { var dd = day(cur); dd.supps[ds.sd] = Math.max(0, Math.min(9, (dd.supps[ds.sd] || 0) + Number(ds.n))); save(); return render(); }
    if (ds.pick !== undefined) return showPicker(lastList[Number(ds.pick)]);
    if (el.id === 'addbtn') return addFromPicker();
    if (el.id === 'savecustom') return saveCustom();
    if (el.id === 'scanbtn') return startScan();
    if (el.id === 'scanstop') return stopScan();
    if (el.id === 'bcgo') return lookup($('#bc').value);
    if (el.id === 'savescanned') return saveScanned();
    if (ds.sdel) {
      S.supps = S.supps.filter(function (s) { return s.id !== ds.sdel; });
      save(); return render();
    }
    if (ds.addsupp !== undefined) {
      S.supps.push({ id: 's' + Date.now().toString(36), name: 'Nuevo suplemento', serving: 5, k: 0, p: 0, c: 0, f: 0, note: '' });
      save(); return render();
    }
    if (ds.reset !== undefined) {
      if (el.getAttribute('data-armed') === '1') {
        try { localStorage.removeItem(KEY); } catch (x) { /* nada */ }
        S = null; load(); view = 'profile'; render(); toast('Datos borrados');
      } else {
        el.setAttribute('data-armed', '1'); el.textContent = 'Pulsa otra vez para confirmar';
      }
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { resMore = false; showAllFoods = false; renderResults(e.target.value); }
    if (e.target.id === 'eqty') updEditPreview();
    if (e.target.id === 'qty') updPreview();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'unit') updPreview();
    if (t.id === 'eunit') updEditPreview();
    if (t.id === 'ftype') setFoodType(t.value);
    if (t.getAttribute && t.getAttribute('data-favname')) {
      var fid = t.getAttribute('data-favname'), nm = String(t.value).trim();
      S.favs.forEach(function (f) { if (f.id === fid && nm) f.name = nm; });
      save();
    }
    if (t.id === 'labelfile' && t.files && t.files[0]) { runOcr(t.files[0]); t.value = ''; }
    if (t.id === 'impfile' && t.files && t.files[0]) {
      var fr = new FileReader();
      fr.onload = function () { reviewImport(String(fr.result)); t.value = ''; };
      fr.onerror = function () { var er = $('#imperr'); if (er) er.textContent = 'No he podido leer el archivo.'; };
      fr.readAsText(t.files[0]);
    }
    if (t.getAttribute && t.getAttribute('data-sf')) {
      var parts = t.getAttribute('data-sf').split(':'), s = null;
      S.supps.forEach(function (x) { if (x.id === parts[0]) s = x; });
      if (!s) return;
      if (parts[1] === 'name') { s.name = t.value.trim() || 'Suplemento'; }
      else {
        var v = parseNum(t.value);
        if (isNaN(v) || v < 0 || v > 1000) { t.value = s[parts[1]]; return; }
        s[parts[1]] = v;
      }
      save();
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'pf') { e.preventDefault(); saveProfile(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'bc') { e.preventDefault(); lookup(e.target.value); }
    if (e.key === 'Escape' && picked) closePicker();
  });

  var NAVI = { today: 'calendar', add: 'plus', progress: 'trend', profile: 'user' };
  Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) {
    var label = b.textContent;
    b.innerHTML = ic(NAVI[b.getAttribute('data-v')], 24) + '<span>' + label + '</span>';
  });

  load();
  view = S.profile ? 'today' : 'profile';
  render();

  /* Para poder instalar la app en el móvil y abrirla sin conexión */
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () { /* no disponible aquí */ });
    }
  } catch (e) { /* nada */ }
})();
</script>
</body>
</html>
