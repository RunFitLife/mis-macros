<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RunFitLife Nutrición</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12191B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RunFit Nutri">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EEF1EC;
  --surface: #FFFFFF;
  --ink: #18262B;
  --muted: #5B6B70;
  --line: #D5DBD3;
  --track: #E3E8E1;
  --prot: #2F55B8;
  --carb: #C9860F;
  --fat: #CF4F66;
  --fib: #2E7D5B;
  --ok: #2E7D5B;
  --warn: #B4531A;
  --font-head: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12191B; --surface: #1B2528; --ink: #E8EEEA; --muted: #9AABA9; --line: #2D3A3D; --track: #26323A;
    --prot: #7C9CF0; --carb: #F0B544; --fat: #F0869A; --fib: #5BC49A; --ok: #5BC49A; --warn: #F0A070;
  }
}
:root[data-theme="dark"] {
  --bg: #12191B; --surface: #1B2528; --ink: #E8EEEA; --muted: #9AABA9; --line: #2D3A3D; --track: #26323A;
  --prot: #7C9CF0; --carb: #F0B544; --fat: #F0869A; --fib: #5BC49A; --ok: #5BC49A; --warn: #F0A070;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
.app { max-width: 640px; margin: 0 auto; padding: 16px 16px 104px; }
h1, h2 { font-family: var(--font-head); font-weight: 700; margin: 0; line-height: 1.1; letter-spacing: 0; }
h1 { font-size: 34px; }
h2 { font-size: 24px; }
p { margin: 0 0 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--prot); outline-offset: 2px; }

.brand { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-family: var(--font-head); font-weight: 600; font-size: 20px; }
.brand img { display: block; border-radius: 7px; }
.datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.datenav h1 { text-align: center; flex: 1; }
.ib { min-width: 44px; min-height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 20px; line-height: 1; }
.ib:disabled { opacity: .35; cursor: default; }

.board { padding: 8px 0 16px; }
.board .num { font-family: var(--font-head); font-weight: 700; font-size: 80px; line-height: .9; }
.board .unit { font-family: var(--font-head); font-weight: 500; font-size: 24px; margin-left: 8px; }
.board.over .num, .board.over .unit { color: var(--warn); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
.card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; gap: 8px; }
.card h2 { margin-bottom: 8px; }
.card-head h2 { margin-bottom: 0; }

.lane { margin-bottom: 18px; }
.lane:last-child { margin-bottom: 0; }
.lane-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.lane-name { font-family: var(--font-head); font-weight: 600; font-size: 21px; }
.lane-val { font-size: 15px; color: var(--muted); }
.lane-val b { color: var(--ink); font-weight: 600; }
.track { position: relative; height: 16px; background: var(--track); border-radius: 8px; }
.fill { height: 100%; border-radius: 8px; min-width: 0; transition: width .4s ease; }
.finish { position: absolute; left: 80%; top: -5px; bottom: -5px; width: 8px; transform: translateX(-50%); border-radius: 2px;
  background: repeating-conic-gradient(var(--ink) 0 25%, var(--surface) 0 50%) 0 0 / 4px 4px; border: 1px solid var(--ink); }
.lane-note { font-size: 14px; margin-top: 6px; color: var(--muted); }
.lane.ok .lane-note { color: var(--ok); font-weight: 500; }
.lane.high .lane-note { color: var(--warn); font-weight: 500; }
.micro .lane { margin-bottom: 14px; }
.micro .lane-name { font-size: 18px; }
.micro .track { height: 8px; border-radius: 4px; }
.micro .fill { border-radius: 4px; }
.micro .finish { width: 6px; top: -3px; bottom: -3px; background-size: 3px 3px; }

.fb { list-style: none; padding: 0; margin: 8px 0 0; }
.fb li { border-left: 3px solid var(--muted); padding: 2px 0 2px 10px; margin: 10px 0; }
.fb li.high { border-color: var(--warn); }
.fb li.good { border-color: var(--ok); }

.items { list-style: none; padding: 0; margin: 0; }
.items > li { padding: 10px 0; border-top: 1px solid var(--line); }
.items > li:first-child { border-top: 0; padding-top: 0; }
.irow { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.iname { font-weight: 600; }
.imacros { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 14px; color: var(--muted); }
.swap { margin-top: 8px; background: var(--track); border-radius: 10px; padding: 8px 10px; font-size: 14px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.link { background: none; border: 0; color: var(--prot); text-decoration: underline; font-weight: 600; min-height: 44px; padding: 0 8px; white-space: nowrap; }

.supp { padding: 10px 0; border-top: 1px solid var(--line); }
.supp:first-of-type { border-top: 0; }
.step { display: flex; align-items: center; gap: 8px; }
.step span { min-width: 24px; text-align: center; font-family: var(--font-head); font-size: 24px; font-weight: 700; }

label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 4px; }
input, select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); padding: 8px 12px; font: inherit; font-size: 16px; }
.field { margin-bottom: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 20px; border: 0; border-radius: 12px; background: var(--ink); color: var(--bg); font-weight: 600; }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.err { color: var(--warn); font-weight: 500; min-height: 1.5em; margin-top: 8px; }

.results { list-style: none; padding: 0; margin: 12px 0 0; max-height: 340px; overflow-y: auto; }
.res { display: block; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 10px 2px; min-height: 48px; }
.rn { display: block; font-weight: 600; }
.rm { display: block; font-size: 13px; color: var(--muted); }
details.card summary { cursor: pointer; font-family: var(--font-head); font-weight: 700; font-size: 24px; min-height: 44px; display: flex; align-items: center; }
details.card[open] summary { margin-bottom: 8px; }

.goalgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 12px; }
.goal b { display: block; font-family: var(--font-head); font-size: 40px; line-height: 1; font-weight: 700; }
.goal span { font-size: 14px; color: var(--muted); }

#scanbox { margin-top: 12px; }
#scanbox[hidden] { display: none; }
#reader { width: 100%; max-width: 420px; margin: 0 auto 12px; border-radius: 12px; overflow: hidden; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-in { display: flex; width: 100%; max-width: 640px; }
.nav button { flex: 1; min-height: 56px; background: none; border: 0; font-weight: 500; font-size: 16px; color: var(--muted); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 600; box-shadow: inset 0 3px 0 var(--ink); }

#toast { position: fixed; left: 50%; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90%; text-align: center; }
#toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>

  <div class="nav-in" id="nav">

    <button data-v="add">Añadir</button>
    <button data-v="profile">Perfil</button>
  </div>
</nav>
<div id="toast" role="status" aria-live="polite"></div>

  /* ---------- Escaneo de código de barras ---------- */
  var scanner = null;
  function stopScan() {

    }

  function loadScanLib(cb) {
    if (window.Html5Qrcode) return cb(true);
    var s = document.createElement('script');

    s.onload = function () { cb(!!window.Html5Qrcode); };
    s.onerror = function () { cb(false); };
    document.head.appendChild(s);
  }
  function startScan() {
    var err = $('#serr'); err.textContent = '';
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      err.textContent = 'Este navegador no permite usar la cámara aquí. Escribe el número del código.'; return;
    }
    loadScanLib(function (ok) {
      if (!ok) { err.textContent = 'No se pudo cargar el lector. Revisa tu conexión o escribe el número del código.'; return; }
      $('#scanbox').hidden = false;
      var F2 = window.Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [F2.EAN_13, F2.EAN_8, F2.UPC_A, F2.UPC_E],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
      scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 260, height: 140 } },
        function (text) { stopScan(); lookup(text); },
        function () { /* sin código en este fotograma */ })
        .catch(function () {
          scanner = null; $('#scanbox').hidden = true;
          err.textContent = 'No he podido abrir la cámara. Revisa el permiso de cámara del navegador o escribe el número del código.';
        });
    });
  }
  function offToFood(p, code) {
    var n = p.nutriments || {};
    function g(x) { var v = parseFloat(n[x]); return isNaN(v) ? null : v; }
    var kcal = g('energy-kcal_100g');
    if (kcal === null) { var kj = g('energy_100g'); if (kj !== null) kcal = kj / 4.184; }
    var prot = g('proteins_100g'), carb = g('carbohydrates_100g'), fat = g('fat_100g');
    if (kcal === null || prot === null || carb === null || fat === null) return null;
    var name = (p.product_name || ('Producto ' + code)).trim();
    var brand = p.brands ? String(p.brands).split(',')[0].trim() : '';
    var food = {
      n: brand ? name + ' (' + brand + ')' : name, k: kcal, p: prot, c: carb, f: fat,
      fi: g('fiber_100g') || 0, ca: (g('calcium_100g') || 0) * 1000, fe: (g('iron_100g') || 0) * 1000, vc: (g('vitamin-c_100g') || 0) * 1000,
      custom: true, off: true
    };
    var sq = parseFloat(p.serving_quantity);
    if (sq > 0 && sq < 2000) food.us = [['ración', sq]];
    if (/\d\s*(ml|cl|l)\b/i.test((p.quantity || '') + ' ' + (p.serving_size || ''))) food.l = true;
    return food;
  }
  function lookup(raw) {
    var code = String(raw).replace(/\D/g, ''), err = $('#serr'), box = $('#picker');
    if (!err) return;
    if (code.length < 8 || code.length > 14) { err.textContent = 'El código debe tener entre 8 y 14 números.'; return; }
    err.textContent = '';
    box.innerHTML = '<section class="card"><p>Buscando el producto...</p></section>';
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var to = setTimeout(function () { if (ctrl) ctrl.abort(); }, 10000);
    fetch('https://world.openfoodfacts.org/api/v2/product/' + code + '.json?fields=product_name,brands,nutriments,serving_quantity,quantity,serving_size', ctrl ? { signal: ctrl.signal } : undefined)
      .then(function (r) { return r.json(); })
      .then(function (j) {
        clearTimeout(to);
        if (!j || j.status !== 1 || !j.product) {
          box.innerHTML = ''; err.textContent = 'No encuentro ese producto en Open Food Facts. Puedes crearlo a mano más abajo con los datos de su etiqueta.'; return;
        }
        var food = offToFood(j.product, code);
        if (!food) {
          box.innerHTML = ''; err.textContent = 'El producto existe, pero le faltan datos nutricionales. Créalo a mano más abajo con su etiqueta.'; return;
        }
        showPicker(food);
      })
      .catch(function () {

        err.textContent = 'No he podido conectar con Open Food Facts. Revisa tu conexión a internet.';
      });
  }

      '<div class="field"><label for="pf-weight">Peso (kg)</label><input id="pf-weight" type="text" inputmode="decimal" value="' + (p.weight || '') + '"></div>' +
      '<div class="field"><label for="pf-height">Altura (cm)</label><input id="pf-height" type="text" inputmode="numeric" value="' + (p.height || '') + '"></div></div>' +
      '<div class="field"><label for="pf-act">Actividad física</label><select id="pf-act">' + Object.keys(ACT).map(function (k) { return opt(k, ACT[k].l, (p.activity || 'mod') === k); }).join('') + '</select></div>' +
      '<div class="field"><label for="pf-goal">Objetivo</label><select id="pf-goal">' + Object.keys(GOALS).map(function (k) { return opt(k, GOALS[k], (p.goal || 'keep') === k); }).join('') + '</select></div>' +
      '<button class="btn" type="submit">Guardar y calcular</button><p class="err" id="perr" role="alert"></p></form>';
    if (T) {
      h += '<section class="card"><h2>Tus objetivos diarios</h2><div class="goalgrid">' +
        '<div class="goal"><b>' + nf(T.k) + '</b><span>kcal</span></div>' +
        '<div class="goal"><b style="color:var(--prot)">' + nf(T.p) + ' g</b><span>proteína</span></div>' +
        '<div class="goal"><b style="color:var(--carb)">' + nf(T.c) + ' g</b><span>carbohidratos</span></div>' +
        '<div class="goal"><b style="color:var(--fat)">' + nf(T.f) + ' g</b><span>grasas</span></div></div>' +
        '<p>Fibra ' + T.fi + ' g, calcio ' + nf(T.ca) + ' mg, hierro ' + T.fe + ' mg y vitamina C ' + T.vc + ' mg.</p>' +
        '<p class="muted small">Cálculo: metabolismo basal con la fórmula Mifflin-St Jeor (' + nf(T.bmr) + ' kcal), multiplicado por tu actividad (' + nf(T.tdee) + ' kcal) y ajustado a tu objetivo. Son valores orientativos y no sustituyen la opinión de un dietista o un médico.</p>' +
        '<button class="btn ghost" data-go="today">Ver mi día</button></section>';
    }
    h += '<section class="card"><h2>Mis suplementos</h2><p class="muted small">Edita los datos de una toma según la etiqueta de tu producto.</p>';
    S.supps.forEach(function (s) {
      var id = esc(s.id);
      h += '<div class="supp"><div class="field"><label for="sn-' + id + '">Nombre</label><input id="sn-' + id + '" data-sf="' + id + ':name" type="text" value="' + esc(s.name) + '"></div>' +
        '<div class="row"><div class="field"><label for="ss-' + id + '">Gramos por toma</label><input id="ss-' + id + '" data-sf="' + id + ':serving" type="text" inputmode="decimal" value="' + s.serving + '"></div>' +
        '<div class="field"><label for="sk-' + id + '">kcal por toma</label><input id="sk-' + id + '" data-sf="' + id + ':k" type="text" inputmode="decimal" value="' + s.k + '"></div>' +
        '<div class="field"><label for="sp-' + id + '">Proteína (g)</label><input id="sp-' + id + '" data-sf="' + id + ':p" type="text" inputmode="decimal" value="' + s.p + '"></div>' +
        '<div class="field"><label for="sc-' + id + '">Carbohidratos (g)</label><input id="sc-' + id + '" data-sf="' + id + ':c" type="text" inputmode="decimal" value="' + s.c + '"></div>' +
        '<div class="field"><label for="sg-' + id + '">Grasas (g)</label><input id="sg-' + id + '" data-sf="' + id + ':f" type="text" inputmode="decimal" value="' + s.f + '"></div></div>' +
        '<button class="link" data-sdel="' + id + '">Quitar este suplemento</button></div>';
    });
    h += '<button class="btn ghost" data-addsupp="1">Añadir suplemento</button></section>';
    h += '<section class="card"><h2>Mis datos</h2><p class="muted small">Todo se guarda en este navegador. Si borras los datos del navegador, se pierden.</p>' +
      '<button class="btn ghost" data-reset="1">Borrar todos mis datos</button></section>';
    return h;
  }

  function saveProfile() {
    var p = {
      sex: $('#pf-sex').value, age: parseNum($('#pf-age').value), weight: parseNum($('#pf-weight').value),
      height: parseNum($('#pf-height').value), activity: $('#pf-act').value, goal: $('#pf-goal').value
    };
    var err = $('#perr');
    if (isNaN(p.age) || isNaN(p.weight) || isNaN(p.height)) { err.textContent = 'Rellena edad, peso y altura con números.'; return; }
    if (p.age < 18 || p.age > 80) { err.textContent = 'Esta app está pensada para adultos de 18 a 80 años.'; return; }
    if (p.weight < 35 || p.weight > 250) { err.textContent = 'El peso debe estar entre 35 y 250 kg.'; return; }
    if (p.height < 120 || p.height > 230) { err.textContent = 'La altura debe estar entre 120 y 230 cm.'; return; }
    S.profile = p; save(); toast('Perfil guardado'); render();
  }
  function doSwap(id) {
    var d = day(cur), idx = -1;
    d.items.forEach(function (i, n) { if (i.id === id) idx = n; });
    if (idx < 0) return;
    var old = d.items[idx], food = old.swap ? foodByName(old.swap) : null;
    if (!food) return;
    d.items[idx] = makeItem(food, old.g, old.meal);
    save(); toast('Cambiado por ' + food.n); render();
  }

  /* ---------- Render y eventos ---------- */
  function render() {
    $('#app').innerHTML = view === 'today' ? renderToday() : (view === 'add' ? renderAdd() : renderProfile());
    Array.prototype.forEach.call(document.querySelectorAll('#nav button'), function (b) {
      b.setAttribute('aria-current', b.getAttribute('data-v') === view ? 'page' : 'false');
    });
    if (view === 'add' && S.profile) renderResults('');
  }
  function setView(v) { stopScan(); view = v; picked = null; render(); window.scrollTo(0, 0); }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('button'); if (!el) return;
    var ds = el.dataset;
    if (ds.v) return setView(ds.v);
    if (ds.go) return setView(ds.go);
    if (ds.act === 'prev') { cur = shiftDay(cur, -1); return render(); }
    if (ds.act === 'next') { if (cur < dateKey(new Date())) { cur = shiftDay(cur, 1); render(); } return; }
    if (ds.del) { var d = day(cur); d.items = d.items.filter(function (i) { return i.id !== ds.del; }); save(); return render(); }
    if (ds.swap) return doSwap(ds.swap);
    if (ds.sd) { var dd = day(cur); dd.supps[ds.sd] = Math.max(0, Math.min(9, (dd.supps[ds.sd] || 0) + Number(ds.n))); save(); return render(); }
    if (ds.pick !== undefined) return showPicker(lastList[Number(ds.pick)]);
    if (el.id === 'addbtn') return addFromPicker();
    if (el.id === 'savecustom') return saveCustom();
    if (el.id === 'scanbtn') return startScan();
    if (el.id === 'scanstop') return stopScan();
    if (el.id === 'bcgo') return lookup($('#bc').value);
    if (el.id === 'savescanned') return saveScanned();
    if (ds.sdel) {
      S.supps = S.supps.filter(function (s) { return s.id !== ds.sdel; });
      save(); return render();
    }
    if (ds.addsupp !== undefined) {
      S.supps.push({ id: 's' + Date.now().toString(36), name: 'Nuevo suplemento', serving: 5, k: 0, p: 0, c: 0, f: 0, note: '' });
      save(); return render();
    }
    if (ds.reset !== undefined) {
      if (el.getAttribute('data-armed') === '1') {
        try { localStorage.removeItem(KEY); } catch (x) { /* nada */ }
        S = null; load(); view = 'profile'; render(); toast('Datos borrados');
      } else {
        el.setAttribute('data-armed', '1'); el.textContent = 'Pulsa otra vez para confirmar';
      }
    }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') renderResults(e.target.value);
    if (e.target.id === 'qty') updPreview();
  });
  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.id === 'unit') updPreview();
    if (t.getAttribute && t.getAttribute('data-sf')) {
      var parts = t.getAttribute('data-sf').split(':'), s = null;
      S.supps.forEach(function (x) { if (x.id === parts[0]) s = x; });
      if (!s) return;
      if (parts[1] === 'name') { s.name = t.value.trim() || 'Suplemento'; }
      else {
        var v = parseNum(t.value);
        if (isNaN(v) || v < 0 || v > 1000) { t.value = s[parts[1]]; return; }
        s[parts[1]] = v;
      }
      save();
    }
  });
  document.addEventListener('submit', function (e) {
    if (e.target.id === 'pf') { e.preventDefault(); saveProfile(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'bc') { e.preventDefault(); lookup(e.target.value); }
  });

  load();
  view = S.profile ? 'today' : 'profile';
  render();

  /* Para poder instalar la app en el móvil y abrirla sin conexión */
  try {
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js').catch(function () { /* no disponible aquí */ });
    }
  } catch (e) { /* nada */ }
})();
</script>
</body>
</html>
